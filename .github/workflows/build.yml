name: macOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run parser tests
        run: swift test
      - name: Build menu-bar app
        run: ZIP=1 bash scripts/package-app.sh
      - name: Verify native-sized menu-bar icon
        run: |
          swift -e '
          import AppKit
          let path = "dist/OmniRouteQuota.app/Contents/Resources/tray-icon-22.png"
          guard let image = NSImage(contentsOfFile: path), image.isValid,
                let bitmap = image.representations.compactMap({ $0 as? NSBitmapImageRep }).first,
                bitmap.pixelsWide == 22, bitmap.pixelsHigh == 22 else {
              fatalError("Expected OmniRouteTray 22px status glyph inside the app bundle")
          }
          '
      - name: Verify provider icons render on macOS
        run: |
          swift -e '
          import AppKit
          for name in ["claude", "codex", "antigravity", "opencode", "github-copilot", "kimi"] {
              let path = "dist/OmniRouteQuota.app/Contents/Resources/providers/\(name).svg"
              guard let image = NSImage(contentsOfFile: path), image.isValid else {
                  fatalError("Provider icon did not render: \(path)")
              }
          }
          '
      - name: Upload app archive
        uses: actions/upload-artifact@v4
        with:
          name: OmniRouteQuota-macos
          path: dist/OmniRouteQuota-macos.zip
          if-no-files-found: error
